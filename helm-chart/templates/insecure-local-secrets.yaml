{{- /*
This template creates dummy secrets for local testing ONLY.
It requires the Ingress to be enabled with every host set to "localhost".
This ensures production deployments can't accidentally use it.
*/}}

{{- /* Run the fail-safe check first */}}
{{- if .Values.secrets.create }}
  {{- if or (not .Values.ingress.enabled) (not .Values.ingress.hosts) }}
    {{- fail "FATAL: Dummy secrets (secrets.create=true) require ingress.enabled=true with at least one 'localhost' host. This is a security risk. For production, set secrets.create to false and use SealedSecrets." }}
  {{- end }}
  {{- range .Values.ingress.hosts }}
    {{- if ne .host "localhost" }}
      {{- fail (printf "FATAL: Dummy secrets (secrets.create=true) are enabled, but the Ingress host is '%s', not 'localhost'. This is a security risk. For production, set secrets.create to false and use SealedSecrets." .host) }}
    {{- end }}
  {{- end }}
{{- end }}

{{- /* If the check passes, proceed with creating the secrets */}}
{{- if .Values.secrets.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.backendSecretName }}
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  DJANGO_SECRET_KEY: {{ .Values.secrets.dummyData.djangoSecretKey | b64enc | quote }}
  SUPERUSER_USERNAME: {{ .Values.secrets.dummyData.superuserUsername | b64enc | quote }}
  SUPERUSER_PASSWORD: {{ .Values.secrets.dummyData.superuserPassword | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.postgresSecretName }}
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  POSTGRES_USER: {{ .Values.secrets.dummyData.postgresUser | b64enc | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.dummyData.postgresPassword | b64enc | quote }}
  POSTGRES_DB: {{ .Values.secrets.dummyData.postgresDb | b64enc | quote }}
{{- end }}
